[package]
name = "nodes-uniprot"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Native DAG adapters for uniprot"

[dependencies]
uniprot = { path = "../../uniprot" }
agentik-core = { path = "../../agentik-core" }
agentik-proc = { path = "../../agentik-proc" }
agentik-sdk = { path = "../../agentik-sdk" }
async-trait = { workspace = true }
reqwest = { version = "0.13", features = ["json", "form"] }
serde = { workspace = true }
serde_json = { workspace = true, features = ["float_roundtrip"] }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["time", "fs"] }

# DAG node dependencies
dag-core = { path = "../../dag-core" }
arrow-array.workspace = true
arrow-schema.workspace = true
datafusion.workspace = true
sha2.workspace = true

schemars.workspace = true
[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "net", "io-util"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serial_test = "3"
tempfile = "3"

[lints]
workspace = true
