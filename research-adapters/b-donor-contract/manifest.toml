schema_version = 1
plugin_name = "b-donor-contract"

[image]
reference = "localhost/autonomics/python-guard@sha256:d7d40ff1494750f26ded735e2551efb86d970355b805868b92ec9107b7ca7c68"
tag = "qualified-cache-v1"
upstream = "Authenticated cached Python OCI; candidate entry only, no protected runtime qualification."
license = "Python-2.0"

# Input producer candidate. R method nodes await their own qualified image.
# No runtime registration, formal admission or scientific approval is implied.
[[nodes]]
kind = "b_donor_frozen_inputs"
desc = "Prepare complete donor model inputs from actual count and source metadata artifacts."
doc = "Eleven File inputs: frozen model template; six count outputs in count/features/featureQC/columns/cellQC/audit order; original sample map; original metadata byte pack; complete decisions; complete gene registry. Outputs retain every observation/gene and original decisions. Every actual count identity and original metadata identity is checked. Conflicting library covariates fail; missing covariates are retained. No fitting, family correction, independence qualification, G0 or formal authority. Disk-backed QC scratch uses the private output workspace."
timeout_secs = 3600
stage_in_mode = "copy"
artifact_prefix = "/artifacts/b_donor_frozen_inputs"
[nodes.resources]
network = "isolated"
read_only_rootfs = true
pull_policy = "never"
cpus = 2.0
memory = "2Gi"
pids_limit = 128
[nodes.ports]
inputs = [{ type = "file" }, { type = "file" }, { type = "file" }, { type = "file" }, { type = "file" }, { type = "file" }, { type = "file" }, { type = "file" }, { type = "file" }, { type = "file" }, { type = "file" }]
outputs = [
  { path = "method-template.json", format = "json" },
  { path = "genes.tsv", format = "tsv" },
  { path = "samples.tsv", format = "tsv" },
  { path = "decisions.tsv", format = "tsv" },
  { path = "provenance.json", format = "json" },
]
[nodes.command]
interpreter = "python3"
script_file = "scripts/run-inputs.py"
[nodes.command.env]
PYTHONDONTWRITEBYTECODE = "1"
