schema_version = 1
plugin_name = "cachexia-10x-preprocessor"

[image]
reference = "localhost/autonomics/single-cell-preprocessor@sha256:5069c3ffaac0b11dfe950c1cd026f4195317be47b529b730572d9e670ad0f59b"
upstream = "Scanpy 1.11.3 / AnnData 0.11.4 / NumPy 2.1.3 / SciPy 1.14.1 / pandas 2.2.3"
license = "BSD-3-Clause"

[[nodes]]
kind = "cachexia_10x_preprocessor"
desc = "Scoped raw 10x header inspection or lossless-count ingestion"
doc = "STAGED. Same four File roles and two output roles as single_cell_preprocessor. Pinned baked source and method packages; lexical cell metadata, exact raw-count body and Float64 loading. Ingest retains official cell-then-gene filters and optional cp10k/log1p with counts layer. Inspect is explicitly header-only and its expressionless H5AD is not analysable. No embedding, annotation, doublet/ambient-RNA, batch integration, tissue QC eligibility, scientific release or G0 certification. Outputs must be fresh. Host pinned-package replay is NOT a pinned-container DAG or resident deployment."
timeout_secs = 3600

[nodes.ports]
inputs = [{type="file",label="matrix_mtx"}, {type="file",label="barcodes_tsv"}, {type="file",label="features_tsv"}, {type="file",label="cell_metadata"}]
outputs = [{path="preprocess_report.json",format="single_cell_preprocess_report_json"}, {path="preprocessed.h5ad",format="h5ad"}]

[nodes.params]
operation = {type="string",default="inspect",doc="Header-only inspect or raw-integer-count ingest"}
min_genes = {type="int",default=0,min=0.0,doc="Frozen cell detected-gene threshold; inspect requires zero"}
min_cells = {type="int",default=0,min=0.0,doc="Frozen gene detected-cell threshold; inspect requires zero"}
normalize_total = {type="bool",default=false,doc="Official cp10k then natural log1p; preserve pre-normalization counts"}
metadata_separator = {type="string",default="auto",doc="auto, tab or comma; lexical cell IDs preserved"}

[nodes.command]
interpreter = "python"
script_file = "scripts/preprocess_guard.py"

[nodes.command.env]
AUTONOMICS_SINGLE_CELL_OPERATION = "{{ operation }}"
AUTONOMICS_SINGLE_CELL_MIN_GENES = "{{ min_genes }}"
AUTONOMICS_SINGLE_CELL_MIN_CELLS = "{{ min_cells }}"
AUTONOMICS_SINGLE_CELL_NORMALIZE_TOTAL = "{{ normalize_total }}"
AUTONOMICS_SINGLE_CELL_METADATA_SEP = "{{ metadata_separator }}"
OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"
NUMBA_NUM_THREADS = "1"

[nodes.resources]
cpus = 1.0
memory = "4Gi"
