schema_version = 1
plugin_name = "cachexia-singscore"

[image]
reference = "ghcr.io/zj-2002/singscore-official@sha256:04981a66d7c3fc7055a185a0102dc9f337dd63381b676681c08e52e8c22e2ca5"
tag = "1.32.0"
upstream = "Official Bioconductor singscore 1.32.0; explicit v4.1 rankGenes/simpleScore settings"
license = "GPL-3"

[[nodes]]
kind = "cachexia_singscore"
desc = "Official singscore with exact sample/metadata and frozen gene identity checks."
doc = "Inputs: gene-by-sample TSV with first column gene, gene/direction signature TSV and sample/group metadata TSV. Gene mapping, length normalization, coverage and common background are upstream contracts, not invented here. Metadata must be an exact unique sample set; invalid values fail. Calls rankGenes(tiesMethod=average,stableGenes=NULL) then simpleScore(knownDirection=TRUE,centerScore=TRUE). Up-only is supported; down-only fails explicitly. No tuning parameters. Outputs sample/group/TotalScore TSV, full official RDS and log."
timeout_secs = 1200
artifact_prefix = "/artifacts/cachexia_singscore"

[nodes.resources]
cpus = 1.0
memory = "2Gi"

[nodes.ports]
inputs = [{ type = "file" }, { type = "file" }, { type = "file" }]
outputs = [
  { path = "singscore_scores.tsv", format = "tsv", label = "scores" },
  { path = "singscore.RDS", format = "r_rds", label = "result" },
  { path = "singscore.log", format = "text", label = "log" }
]

[nodes.command]
interpreter = "Rscript"
script_file = "scripts/singscore.R"
