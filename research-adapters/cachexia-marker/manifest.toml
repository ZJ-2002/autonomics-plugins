schema_version = 1
plugin_name = "cachexia-marker"

[image]
reference = "localhost/autonomics/single-cell-preprocessor@sha256:5069c3ffaac0b11dfe950c1cd026f4195317be47b529b730572d9e670ad0f59b"
upstream = "AnnData 0.11.4 / Scanpy 1.11.3 / NumPy 2.1.3 / SciPy 1.14.1; USER_DEFINED marker mean heuristic"
license = "BSD-3-Clause"

[[nodes]]
kind = "cachexia_h5ad_marker_annotate"
desc = "Frozen complete marker-occurrence arithmetic annotation with safe Unknown fallback."
doc = "Two Files: H5AD and exact frozen JSON. Original dictionary heuristic: available marker-occurrence mean per cell, optionally mean across pre-frozen clusters, ordered first maximum and strict > threshold; no probability interpretation. Explicit X/layer, none or official Scanpy full-library log CP10k, complete marker/present/missing ledgers and group counts. Unknown uses own best score without indexing a nonexistent signature. Seven full scores/H5AD/audit/log/genes/request/groups ports. Statistical official layer NOT_APPLICABLE: not CellTypist/UCell/singscore/score_genes, donor inference or G0."
timeout_secs = 3600
[nodes.ports]
inputs = [{type="file"}, {type="file"}]
outputs = [{path="result.parquet",format="parquet"}, {path="output.h5ad",format="h5ad"}, {path="audit.json",format="json"}, {path="marker.log",format="text"}, {path="genes.tsv",format="tsv"}, {path="request_ledger.tsv",format="tsv"}, {path="groups.parquet",format="parquet"}]
[nodes.command]
interpreter = "python3"
script_file = "scripts/annotate.py"
[nodes.command.env]
NUMBA_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"
OPENBLAS_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
[nodes.resources]
cpus = 1.0
memory = "2Gi"
network = "isolated"
pull_policy = "never"
