schema_version = 1
plugin_name = "cachexia-hyprcoloc"

[image]
reference = "ghcr.io/auto-nomics/autonomics/hyprcoloc@sha256:395a36903d3c3ed6c753aef85f5b0a57044f86968e4d79804e4cc85f36aa5617"
tag = "0.0.2-fixed-source"
upstream = "jrs95/hyprcoloc@0348bbdd977be731d82e4efda115a9bed63cd44f; R 4.5.1"
license = "GPL-3.0-only"

[[nodes]]
kind = "cachexia_hyprcoloc_official"
desc = "Official HyPrColoc with explicit trait, overlap, correlation, LD and method contracts."
doc = "Six ordered files: SNP/beta/SE table, trait mapping, hash/method contract, trait correlation, sample overlap, signed SNP LD. No implicit intersection, independence, missing-value removal or scientific release. Outputs complete typed official object, RDS, log, SNP ledger, audit and trait ledger. Regional-only and regional-sensitivity modes are explicitly not colocalization findings. Rejects the upstream 0.0.2 rapid-sensitivity snps.clc defect without silently replacing reg_steps. Not PP.H4, coloc.susie, signal-qualified three-trait bridge, family assembly, full-domain or resident-daemon certification."
timeout_secs = 900
artifact_prefix = "/artifacts/cachexia_hyprcoloc_official"
[nodes.resources]
cpus = 1.0
memory = "2Gi"
network = "isolated"
pull_policy = "never"
[nodes.ports]
inputs = [{ type = "file" }, { type = "file" }, { type = "file" }, { type = "file" }, { type = "file" }, { type = "file" }]
outputs = [{ path = "hyprcoloc_summary.tsv", format = "tsv" }, { path = "hyprcoloc.RDS", format = "r_rds" }, { path = "hyprcoloc.log", format = "text" }, { path = "snps.tsv", format = "tsv" }, { path = "audit.tsv", format = "tsv" }, { path = "traits.tsv", format = "tsv" }]
[nodes.command]
interpreter = "Rscript"
script_file = "scripts/hyprcoloc.R"
[nodes.command.env]
OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"
