schema_version = 1
plugin_name = "cachexia-lcmm-typed-values"
[image]
reference = "ghcr.io/zj-2002/single-cell-preprocessor@sha256:e2f9fcd5ccf9e97b0f0129466df5abb21ae47ed32f123f6953b79fd83d915e20"
tag = "pyarrow-25.0.1-typed-lcmm-boundary"
upstream = "PyArrow25.0.1 explicit schema engineering boundary"
license = "Apache-2.0"
[[nodes]]
kind = "cachexia_lcmm_values_to_parquet"
desc = "Verified full LCMM numeric fields with exact lexical coordinates to explicitly typed Parquet."
doc = "Two files: complete numeric summary TSV and matching successful upstream audit. Four Parquet/audit/log/schema outputs. Retains string test/row/field/status axes, nullable float64 value and explicit NaN/Inf status. Explicit uint32 source_position must remain in materialized tables because native sinks need not preserve physical batch row order. All original coordinates and positions remain verifiable; no numerical transformation or scientific inference."
timeout_secs = 600
[nodes.ports]
inputs = [{type="file"}, {type="file"}]
outputs = [{path="values.parquet",format="parquet"}, {path="typed_audit.json",format="json"}, {path="typed.log",format="text"}, {path="schema.json",format="json"}]
[nodes.command]
interpreter = "python"
script_file = "scripts/typed_values.py"
[nodes.resources]
cpus = 1.0
memory = "2Gi"
network = "isolated"
pull_policy = "never"

[[nodes]]
kind = "cachexia_lcmm_values_to_parquet_v2"
desc = "Version2 explicit LCMM numeric transport retaining empirical or synthetic provenance."
doc = "Two Files: complete numeric summary and exact version2 upstream audit. Four outputs preserve full field axes, nullable values and source_position. Request and audit must agree on schema2, neutral trajectory role, original input role and non-scientific scope. Provenance remains in Parquet metadata/audit/schema; no research permission or G0. Version1 states are rejected."
timeout_secs = 600
[nodes.ports]
inputs = [{type="file"}, {type="file"}]
outputs = [{path="values.parquet",format="parquet"}, {path="typed_audit.json",format="json"}, {path="typed.log",format="text"}, {path="schema.json",format="json"}]
[nodes.command]
interpreter = "python"
script_file = "scripts/typed_values.py"
[nodes.command.env]
AUTONOMICS_TECHNICAL_CONTRACT_VERSION = "2"
[nodes.resources]
cpus = 1.0
memory = "2Gi"
network = "isolated"
pull_policy = "never"
