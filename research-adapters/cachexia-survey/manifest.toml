memory = "2Gi"
network = "isolated"
pull_policy = "never"

[[nodes]]
kind = "cachexia_trim_weights_v2"
desc = "V2 method-only real or synthetic input: Official trimWeights with frozen bounds and complete design preservation."
doc = "Version 2 technical data contract: accepts explicitly declared SYNTHETIC_TECHNICAL_INPUT or EMPIRICAL_TECHNICAL_INPUT under TECHNICAL_ONLY_NOT_G0 and NOT_GRANTED. Exact input hashes, ordered rows, complete official survey state and role-bound lineage required. No model, sampling design, external population totals or scientific eligibility is inferred. Same fixed official survey 4.5 calls and declared output ports; no automatic migration of v1 or frozen DAG bindings."
timeout_secs = 600
[nodes.ports]
inputs = [{type="file"}, {type="file"}]
outputs = [{path="summary.tsv",format="tsv"}, {path="state.rds",format="rds"}, {path="audit.json",format="json"}, {path="survey.log",format="text"}, {path="row_ledger.tsv",format="tsv"}]
[nodes.command]
interpreter = "Rscript"
script_file = "scripts/survey.R"
[nodes.command.env]
AUTONOMICS_TECHNICAL_CONTRACT_VERSION = "2"
CACHEXIA_SURVEY_MODE = "trim"
OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
[nodes.resources]
cpus = 1.0
memory = "2Gi"
network = "isolated"
pull_policy = "never"
