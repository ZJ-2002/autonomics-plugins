schema_version = 1
plugin_name = "cachexia-survey"

[image]
reference = "ghcr.io/zj-2002/survey-official@sha256:6f3e6f417912b7fb2c2b344ceaa11ff6031cde7848740caf6450c4366b5fbc61"
tag = "survey-4.5-R-4.6.1-local-proof"
upstream = "CRAN survey 4.5; frozen official source archive compiled without patches"
license = "GPL-2.0-or-later"

[[nodes]]
kind = "cachexia_survey_bind_contract"
desc = "Bind only an upstream immutable RDS content SHA256 into an otherwise frozen analysis contract."
doc = "Two Files: complete technical survey state and explicit unresolved template. Refuses changed axes/scope/qualification/budgets, duplicate keys and literal-hash replacement; only input0_sha256 may change. Outputs resolved JSON, audit and log. No statistical computation or autonomous method choice."
timeout_secs = 300
[nodes.ports]
inputs = [{type="file"}, {type="file"}]
outputs = [{path="resolved_contract.json",format="json"}, {path="bind_audit.json",format="json"}, {path="bind.log",format="text"}]
[nodes.command]
interpreter = "Rscript"
script_file = "scripts/bind_contract.R"
[nodes.command.env]
OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
[nodes.resources]
cpus = 1.0
memory = "2Gi"
network = "isolated"
pull_policy = "never"

[[nodes]]
kind = "cachexia_survey_design"
desc = "Build a fully frozen official survey design, including stages, zero weights and domains."
doc = "Two Files: fully typed lexical TSV and exact JSON parameters/hash/row axis. Five summary TSV/full state RDS/audit/log/complete row-ledger outputs. Frozen synthetic technical scope, not actual CHARLS/ELSA/NHANES eligibility, primary family or G0; never rebuild calibrated designs from updated weights alone."
timeout_secs = 600
[nodes.ports]
inputs = [{type="file"}, {type="file"}]
outputs = [{path="summary.tsv",format="tsv"}, {path="state.rds",format="rds"}, {path="audit.json",format="json"}, {path="survey.log",format="text"}, {path="row_ledger.tsv",format="tsv"}]
[nodes.command]
interpreter = "Rscript"
script_file = "scripts/survey.R"
[nodes.command.env]
CACHEXIA_SURVEY_MODE = "design"
OPENBLAS_NUM_THREADS = "1"
OMP_NUM_THREADS = "1"
MKL_NUM_THREADS = "1"
[nodes.resources]
cpus = 1.0
memory = "2Gi"
network = "isolated"
pull_policy = "never"

