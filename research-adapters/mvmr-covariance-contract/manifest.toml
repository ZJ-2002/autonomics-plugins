schema_version = 1
plugin_name = "mvmr-covariance-contract"

[image]
reference = "localhost/autonomics/python-guard@sha256:d7d40ff1494750f26ded735e2551efb86d970355b805868b92ec9107b7ca7c68"
tag = "fixed-stdlib-candidate"
upstream = "Python standard-library covariance provenance validator; not an estimator"
license = "MIT"

[[nodes]]
kind = "mvmr_frozen_covariance_receipt"
desc = "Validate actual joint SNP exposure covariance and packed evidence without estimating it."
doc = "Four File inputs: frozen covariance recipe, actual joint table, supplied matrices, exact provenance evidence pack. Output is the byte-bound preparation receipt consumed by the official MVMR adapter. Uses SE and identity only; never fills zero or reads effects/P to select covariance. UNRESOLVED provenance produces a retained blocked-status receipt with exit zero so coefficient rows can survive while F/Q stay NOT_RUN. This grants no GA08, source qualification, model freeze or scientific approval; formal producer-chain qualification remains outstanding."
timeout_secs = 120
stage_in_mode = "copy"
artifact_prefix = "/artifacts/mvmr_frozen_covariance_receipt"
[nodes.resources]
network = "isolated"
read_only_rootfs = true
pull_policy = "never"
cpus = 1.0
memory = "512Mi"
pids_limit = 64
[nodes.ports]
inputs = [{ type = "file" }, { type = "file" }, { type = "file" }, { type = "file" }]
outputs = [{ path = "receipt.json", format = "json" }]
[nodes.command]
interpreter = "python3"
script_file = "scripts/run-covariance.py"
