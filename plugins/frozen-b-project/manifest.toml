schema_version = 1
plugin_name = "frozen-b-project"

[image]
reference = "docker.io/library/python@sha256:a66d3a463d0be3cc537c269b0d3418746dda512417a975559a0eaa8a6406baaf"
tag = "3.14-slim-bookworm"
upstream = "Actual cached official Python runtime with bounded SYN intake/family and negative-case OCI tests. Operator installation and current destination store approval required."
license = "Python-2.0"

[[nodes]]
kind = "frozen_b_legacy_intake"
desc = "Bind the current v4.3.2 B frozen legacy project to normalized-log2 method inputs."
doc = "Nineteen actual source/contract files in project-lock order: config, manifest, samples, features, discovery scope, design certificate, software lock, R dependencies, R session, scientific code, scientific rules, scope decision, matrix gzip, source metadata, G0 certificate, family lock, restore acceptance, runtime manifest, original byte verifier. Retains all23786 genes and all46 source columns in provenance; selects exactly locked22 assays17case5control without inferring labels or renormalizing. Returns bound primary config/expression/genes/samples/decisions/intake on the original six ports, then unadjusted config/intake and therapy_sensitivity config/intake. All three frozen formulas/certificates and treatment N/Y are bound; no additional models. Current LEGACY source only; old design ZIP/CONDITIONAL roles forbidden. Original full-project byte verifier must be run by the operator before scientific execution; this B-only adapter records it as unexecuted. No fit, formal authorization, new G0 or unseen qualification."
timeout_secs = 1200
stage_in_mode = "copy"
artifact_prefix = "/artifacts/frozen_b_legacy_intake"
[nodes.resources]
network = "isolated"
read_only_rootfs = true
pull_policy = "never"
cpus = 1.0
memory = "1Gi"
pids_limit = 64
[nodes.ports]
inputs = [{type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}, {type="file"}]
outputs = [{path="config.json",format="json"}, {path="expression.tsv",format="tsv"}, {path="genes.tsv",format="tsv"}, {path="samples.tsv",format="tsv"}, {path="decisions.tsv",format="tsv"}, {path="intake.json",format="json"}, {path="unadjusted-config.json",format="json"}, {path="unadjusted-intake.json",format="json"}, {path="therapy_sensitivity-config.json",format="json"}, {path="therapy_sensitivity-intake.json",format="json"}]
[nodes.command]
interpreter = "python3"
script_file = "scripts/run-intake.py"
[nodes.command.env]
PYTHONDONTWRITEBYTECODE = "1"

[[nodes]]
kind = "frozen_b_legacy_family"
desc = "Complete all23786 B legacy gene rows with full-denominator BH/BY."
doc = "Four actual files: limma results, same intake gene registry, intake audit, actual limma audit. Exact source/config/software/row identity; requires actual producer q_BH/q_BY and its official stats4.6.1 p.adjust receipt, without a Python adjustment fallback. Constant/non-estimable raw p stays NA and adjustment denominator includes value1. Outputs full family TSV and audit, exact primary or prespecified sensitivity role/model and actual formula/rank/df. Each model independently uses all23786 genes, without pooling sensitivities into the primary denominator; the complete frozen beta/SE/df/CI/p fields are included. Paired normalized producer and family must use the same qualified source revision. No old conditional-role mixing, gene selection, formal authority or unseen validation."
timeout_secs = 1200
stage_in_mode = "copy"
artifact_prefix = "/artifacts/frozen_b_legacy_family"
[nodes.resources]
network = "isolated"
read_only_rootfs = true
pull_policy = "never"
cpus = 1.0
memory = "1Gi"
pids_limit = 64
[nodes.ports]
inputs = [{type="file"}, {type="file"}, {type="file"}, {type="file"}]
outputs = [{path="family.tsv",format="tsv"}, {path="family-audit.json",format="json"}]
[nodes.command]
interpreter = "python3"
script_file = "scripts/run-family.py"
[nodes.command.env]
PYTHONDONTWRITEBYTECODE = "1"
