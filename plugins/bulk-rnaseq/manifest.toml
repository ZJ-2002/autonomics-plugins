schema_version = 1
plugin_name = "bulk-rnaseq"

[image]
reference = "ghcr.io/zj-2002/bulk-rnaseq-official@sha256:8b280a45781160f3dc1f5bfac90862b8a85d7d2bf1b89146e418658cca4ca85a"
tag = "1.0.4"
upstream = "SHA-locked author sources: limma 3.66.0, edgeR 4.8.2, statmod 1.5.2, WGCNA 1.74; R 4.5.3; owned digest-pinned DESeq2 base; WGCNA installation is not method certification"
license = "Artistic-2.0 OR GPL-2.0-or-later"

[[nodes]]
kind = "limma_voom"
desc = "Runs official limma + voom + eBayes in an isolated container."
doc = """
Input ports are an integer count matrix and sample metadata. The node
constructs the requested design formula, applies TMM (or quantile)
normalization, fits limma::voom + eBayes, optionally contrasts two outcome
levels, and publishes the top table, voom weights, normalized expression,
contrast summary and a run report. Quantile normalization occurs inside
official voom, so its expression and weights use the same scale. Literal
gene/sample IDs and complete input row shapes are preserved. Existing
outputs, fractional/transformed counts, incomplete or rank-deficient designs
are rejected. The report retains all kept and excluded gene IDs. BH values
cover only genes retained by filterByExpr, not a study's frozen family.
No reference panel is required. No study eligibility or scientific release
is granted by successful execution.
Both input and output tables use standard double-quoted TSV with doubled
embedded double quotes. Lexical IDs are preserved before method-specific
validation; malformed quotes and ambiguous legacy bare quotes are rejected.
Consumers must decode quoted TSV and keep identity columns as strings;
default type inference is not a general lexical-identity guarantee.
"""
timeout_secs = 3600
artifact_prefix = "/artifacts/limma_voom"

[nodes.ports]
inputs = [
  { type = "file", label = "count_matrix" },
  { type = "file", label = "sample_metadata" },
]
outputs = [
  { path = "results.tsv", format = "limma_voom_results_tsv" },
  { path = "voom_weights.tsv", format = "limma_voom_weights_tsv" },
  { path = "normalized_expression.tsv", format = "limma_voom_normalized_tsv" },
  { path = "contrast_summary.tsv", format = "limma_voom_contrast_summary_tsv" },
  { path = "run_report.json", format = "limma_voom_run_report_json" },
]

[nodes.params]
outcome_var = { type = "string", doc = "Metadata column holding the outcome; required" }
contrast_var = { type = "string", doc = "Contrast column; must equal outcome_var in the deterministic first contract" }
contrast_levels = { type = "string", default = "", doc = "Comma-joined categorical levels as reference,test (e.g. ctrl,case); exactly two entries for categorical outcome, empty for continuous" }
covariates = { type = "string", default = "", doc = "Comma-joined metadata covariate columns (e.g. batch,sex); simple R identifiers, no duplicates, never the outcome or sample_id; empty means none" }
outcome_mode = { type = "string", default = "categorical", doc = "categorical or continuous" }
normalization = { type = "string", default = "tmm", doc = "tmm, quantile, or none" }
alpha = { type = "number", default = 0.05, exclusive_min = 0.0, exclusive_max = 1.0, doc = "Reported analysis threshold, strictly between 0 and 1; all retained genes are returned, not filtered by significance" }
threads = { type = "int", default = 1, min = 1.0, max = 1.0, doc = "Fixed at 1: the deterministic first contract forbids parallel execution" }

[nodes.command]
interpreter = "/opt/autonomics/Rscript-vanilla"
script_file = "limma_voom_runner.R"

[nodes.command.env]
AUTONOMICS_LIMMA_OUTCOME = "{{ outcome_var }}"
AUTONOMICS_LIMMA_CONTRAST_VAR = "{{ contrast_var }}"
AUTONOMICS_LIMMA_CONTRAST_LEVELS = "{{ contrast_levels }}"
AUTONOMICS_LIMMA_COVARIATES = "{{ covariates }}"
AUTONOMICS_LIMMA_OUTCOME_MODE = "{{ outcome_mode }}"
AUTONOMICS_LIMMA_NORMALIZATION = "{{ normalization }}"
AUTONOMICS_LIMMA_ALPHA = "{{ alpha }}"
AUTONOMICS_LIMMA_THREADS = "{{ threads }}"

[nodes.resources]
cpus = 2.0
memory = "6Gi"
pids_limit = 256
shm_size = "1Gi"

[[nodes]]
kind = "wgcna"
desc = "Official WGCNA blockwise coexpression with truthful adjacency, TOM and QC ledgers."
doc = """
Input port 0 is a gene-by-sample expression matrix (genes as rows, samples
as columns, gene_id as the first column). The legacy wrapper accepted an
optional second sample-metadata input, but the v0 DSL has no optional-port
flag, so only the wired expression input is declared; the baked runner
treats a missing AUTONOMICS_INPUT1 as no metadata and publishes eigengenes
without covariate columns. Input values must be finite continuous normalized
expression; the runner cannot infer or approve the scale from numeric values.
Official goodSamplesGenes exclusions are recorded without losing gene IDs.
The default power=0 uses the official powerEstimate at power_cutoff and fails
without a silent fallback if unavailable. Positive power is an explicitly
supplied fixed value, not a study-approved choice. Signed/unsigned networks
and Pearson/bicor use consistent correlation settings throughout the scan,
adjacency, blockwiseModules and kME. Adjacency and TOM summaries describe
actual within-block offdiagonal similarities, not module sizes or guessed
block counts. TOM values are loaded from actual official saved TOMs. All six
outputs are required and existing outputs are rejected. Ordinary failures
roll back publication; multi-file atomicity and concurrent writers are not
certified. Coexpression is not causality, trait testing, or scientific release.
Numerical and DAG qualification of this repaired revision remains pending.
"""
timeout_secs = 7200
artifact_prefix = "/artifacts/wgcna"

[nodes.ports]
inputs = [{ type = "file", label = "expression_matrix" }]
outputs = [
  { path = "soft_threshold.tsv", format = "wgcna_soft_threshold_tsv" },
  { path = "adjacency_stats.tsv", format = "wgcna_adjacency_stats_tsv" },
  { path = "tom_stats.tsv", format = "wgcna_tom_stats_tsv" },
  { path = "modules.tsv", format = "wgcna_modules_tsv" },
  { path = "module_eigengenes.tsv", format = "wgcna_eigengenes_tsv" },
  { path = "run_report.json", format = "wgcna_run_report_json" },
]

[nodes.params]
network_type = { type = "string", default = "signed", doc = "signed or unsigned" }
cor = { type = "string", default = "pearson", doc = "pearson or bicor" }
min_module_size = { type = "int", default = 30, min = 5.0, max = 2147483647.0, doc = "Minimum module size for the dynamic tree cut" }
deep_split = { type = "int", default = 2, min = 0.0, max = 4.0, doc = "Pectinate-tree split sensitivity passed to blockwiseModules" }
merge_threshold = { type = "number", default = 0.25, exclusive_min = 0.0, exclusive_max = 1.0, doc = "Eigengene merge cut height; strictly between 0 and 1" }
max_block_size = { type = "int", default = 5000, min = 500.0, max = 2147483647.0, doc = "Official target block size, not a strict mathematical or memory ceiling" }
threads = { type = "int", default = 1, min = 1.0, max = 2147483647.0, doc = "WGCNA worker threads; 1 disables parallel computation; not a global resource budget" }
power = { type = "number", default = 0.0, min = 0.0, max = 30.0, doc = "0 uses official automatic power estimation; positive value is an explicit fixed power, never an automatic fallback" }
power_cutoff = { type = "number", default = 0.85, exclusive_min = 0.0, exclusive_max = 1.0, doc = "Official pickSoftThreshold RsquaredCut" }
max_p_outliers = { type = "number", default = 1.0, min = 0.0, max = 1.0, doc = "Official bicor maxPOutliers, consistently used throughout; 1 preserves the author default, not the FAQ recommendation of 0.05 or 0.1" }
seed = { type = "int", default = 54321, min = 0.0, max = 2147483647.0, doc = "Official blockwise preclustering seed; R RNG kind also recorded" }

[nodes.command]
interpreter = "/opt/autonomics/Rscript-vanilla"
script_file = "wgcna_runner.R"

[nodes.command.env]
AUTONOMICS_WGCNA_NETWORK_TYPE = "{{ network_type }}"
AUTONOMICS_WGCNA_COR = "{{ cor }}"
AUTONOMICS_WGCNA_MIN_MODULE_SIZE = "{{ min_module_size }}"
AUTONOMICS_WGCNA_DEEP_SPLIT = "{{ deep_split }}"
AUTONOMICS_WGCNA_MERGE_THRESHOLD = "{{ merge_threshold }}"
AUTONOMICS_WGCNA_MAX_BLOCK_SIZE = "{{ max_block_size }}"
AUTONOMICS_WGCNA_THREADS = "{{ threads }}"
AUTONOMICS_WGCNA_POWER = "{{ power }}"
AUTONOMICS_WGCNA_POWER_CUTOFF = "{{ power_cutoff }}"
AUTONOMICS_WGCNA_MAX_P_OUTLIERS = "{{ max_p_outliers }}"
AUTONOMICS_WGCNA_SEED = "{{ seed }}"

[nodes.resources]
cpus = 4.0
memory = "12Gi"
pids_limit = 256
shm_size = "2Gi"
