schema_version = 1
plugin_name = "geo"

[image]
reference = "ghcr.io/zj-2002/biotools-py@sha256:7ad6aeafa87672699d28b61b6bed12fc81fcdbfc43222a0abf17e2d56fb806f5"
tag = "v1"
upstream = "NCBI GEO FTP mirror over HTTPS (ftp.ncbi.nlm.nih.gov)"
license = "CC0-1.0 (GEO data)"

# 说明：GEO/SRA 元数据下载家族。全部为零输入源节点（inputs = []），
# 输出文件名固定，供 DAG 下游直接引用。原始 FASTQ 下载不在本家族范围
# （需 sra-tools，体积与时长都不适合默认容器超时）；run-level 元数据
# 与供者/run 映射由 sra_runinfo 覆盖，满足供者身份核验需求。

[[nodes]]
kind = "geo_series_matrix"
desc = "Download GEO series matrix (expression matrix + sample metadata) for a GSE accession"
doc = """
按 GSE accession 从 NCBI 官方 HTTPS 镜像下载 series_matrix.txt.gz。
输出：series_matrix.txt.gz（原始字节，未解压）+ geo_fetch.log
（URL、HTTP 状态、字节数、下载文件的 sha256 —— 自带内容锚，可直接进运行账本）。
输入构念：处理后的表达矩阵 + 样本表（如 GSE130563 等 §8.3 资源）。
可选 matrix_file 必须是当前 accession 的确切官方矩阵文件名；默认只请求
原 canonical 文件，不自动选择平台。完整 gzip CRC、系列身份与闭合表标记校验；
HTTP/内容失败保留诊断但不发布正常 payload。多平台需明确冻结文件名，
本节点不组装平台或授予资源/供者资格。
"""
timeout_secs = 14400
artifact_prefix = "/artifacts/geo_series_matrix"

[nodes.ports]
inputs = []
outputs = [
  { path = "series_matrix.txt.gz", format = "geo_series_matrix" },
  { path = "geo_fetch.log", format = "geo_fetch_log" },
]

[nodes.params]
accession = { type = "string", doc = "GEO series accession, e.g. GSE130563" }
matrix_file = { type = "string", default = "", doc = "Optional exact accession/platform matrix filename; empty retains canonical filename, never chooses a platform" }

[nodes.command]
interpreter = "python3"
script_file = "scripts/geo_fetch.py"

[nodes.command.env]
GEO_ACCESSION = "{{ accession }}"
GEO_MODE = "matrix"
GEO_MATRIX_FILE = "{{ matrix_file }}"

[nodes.resources]
network = "egress"
cpus = 1
memory = "512m"
pull_policy = "never"

[[nodes]]
kind = "geo_soft"
desc = "Download GEO SOFT family file (full sample/series metadata) for a GSE accession"
doc = """
按 GSE accession 下载官方 family.soft.gz（SOFT 格式全量元数据：样本属性、
平台注释、submitter 提供的临床字段）。输出：family.soft.tgz + geo_fetch.log。
用途：供者→样本映射、临床表型字段核验（FILE_VERIFIED 证据的一部分）。
为兼容原 IO，输出 basename 仍 family.soft.tgz、原 format 标签仍 geo_soft；
其真实内容是 gzip 压缩的 SOFT 文本，不是 tar，日志显式记录该格式。
完整 gzip CRC、SOFT 结构和系列身份校验。失败处理同 geo_series_matrix。
解释边界：SOFT 里的 submitter 字段未经
统一编码，字段语义核验在下游完成，本节点不解释内容。
"""
timeout_secs = 14400
artifact_prefix = "/artifacts/geo_soft"

[nodes.ports]
inputs = []
outputs = [
  { path = "family.soft.tgz", format = "geo_soft" },
  { path = "geo_fetch.log", format = "geo_fetch_log" },
]

[nodes.params]
accession = { type = "string", doc = "GEO series accession, e.g. GSE130563" }

[nodes.command]
interpreter = "python3"
script_file = "scripts/geo_fetch.py"

[nodes.command.env]
GEO_ACCESSION = "{{ accession }}"
GEO_MODE = "soft"

[nodes.resources]
network = "egress"
cpus = 1
memory = "512m"
pull_policy = "never"

[[nodes]]
kind = "sra_runinfo"
desc = "Download SRA RunInfo table (run-level metadata) for a GEO/SRA accession"
doc = """
按 accession（GSE/SRP/SRX/SRR）从官方 SRA backend runinfo CSV 获取并
逐字段无损转为 TSV：每 run 一行，含 Run、SampleName、LibraryName、spots/bases、
Platform 等。输出：runinfo.tsv + geo_fetch.log。
用途：pooled 库供者身份审计（方案 §8.4：pooled 库的细胞数不增加生物学
重复；run↔sample↔library 映射是核验起点）。
GSE 仅通过官方 self-SOFT 的明确 SRA study relation 技术解析；唯一关系可解析，
无/多关系不猜。多关系可由 sra_accession 显式选择，必须属于官方关系集；
原关系/源摘要/解析ID完整入日志，但不代表科研冻结或队列资格。
失败处理：非 200、空表、重复Run、表结构或查询身份不符均非零且保留诊断。
解释边界：这不是 Run Selector 额外临床字段表。RunInfo 的
 biosample 映射不含供者临床信息，供者身份仍以 GEO/SOFT 与原文为准。
"""
timeout_secs = 3600
artifact_prefix = "/artifacts/sra_runinfo"

[nodes.ports]
inputs = []
outputs = [
  { path = "runinfo.tsv", format = "sra_runinfo" },
  { path = "geo_fetch.log", format = "geo_fetch_log" },
]

[nodes.params]
accession = { type = "string", doc = "GSE / SRP / SRX / SRR accession" }
sra_accession = { type = "string", default = "", doc = "Optional explicit SRP study selection among official GSE SRA relations; never bypasses relation validation" }

[nodes.command]
interpreter = "python3"
script_file = "scripts/geo_fetch.py"

[nodes.command.env]
SRA_ACCESSION = "{{ accession }}"
GEO_MODE = "runinfo"
GEO_SRA_ACCESSION = "{{ sra_accession }}"

[nodes.resources]
network = "egress"
cpus = 1
memory = "512m"
pull_policy = "never"

[[nodes]]
kind = "geo_suppl"
desc = "Download a named supplementary file from a GEO series (e.g. LINCS/CMap gctx on GSE92742)"
doc = """
按 GSE accession + suppl 目录下的确切文件名下载任意补充文件（原样字节，
不解压）。用途：LINCS/CMap 参考谱（GSE92742_Broad_LINCS_Level5_COMPZ.
MODZ_n473647x12328.gctx.gz 等）、gene_info/pert_info 映射表——方案 §18.2
的参考数据入口。
输出：保留原固定 basename suppl_file、format 标签 geo_suppl，原始上游文件名
在日志中记录（不是把输出路径改成参数）；字节原样 + geo_fetch.log（URL/sha256 自锚；GSE92742 还有
官方 SHA512SUMS 可交叉核对）。
失败处理：accession 或单段安全文件名不符（含 /、反斜线、控制字符或 . / .. 段）
→ 退出 2；HTML、完整 gzip CRC 不符（.gz 后缀时）→ 非零，保留诊断且不发布
正常 payload。解释边界：gctx 内部行标识符按上游发布口径
（LINCS 用 Entrez ID，符号映射用同目录 gene_info 在下游完成），本节点
只负责字节忠实 + 内容锚。
"""
timeout_secs = 28800
artifact_prefix = "/artifacts/geo_suppl"

[nodes.ports]
inputs = []
outputs = [
  { path = "suppl_file", format = "geo_suppl" },
  { path = "geo_fetch.log", format = "geo_fetch_log" },
]

[nodes.params]
accession = { type = "string", doc = "GEO series accession, e.g. GSE92742" }
suppl_file = { type = "string", doc = "exact filename under the series suppl/ directory" }

[nodes.command]
interpreter = "python3"
script_file = "scripts/geo_fetch.py"

[nodes.command.env]
GEO_ACCESSION = "{{ accession }}"
GEO_SUPPL_FILE = "{{ suppl_file }}"
GEO_MODE = "suppl"

[nodes.resources]
network = "egress"
cpus = 1
memory = "1g"
pull_policy = "never"

[[nodes]]
kind = "geo_suppl_list"
desc = "List the supplementary-file directory of a GEO series (accession → file manifest)"
doc = """
按 GSE accession 抓取 suppl/ 目录的 Apache 列表页，输出确定性文件清单
suppl_manifest.tsv（filename / approx_size_bytes / last_modified，按文件名
排序）+ geo_fetch.log（含清单自身的 sha256 内容锚）。
用途：accession → 精确文件名的清单解析——登记表只给 accession 时，
先跑本节点拿到 suppl 文件名，再把确切文件名交给 geo_suppl 下载。
完整性闸门：解析条目必须覆盖页面中全部裸文件名锚点；锚点集合由标准库
HTML 解析器提取（兼容单引号/双引号/无引号与实体编码的 href，与行正则
无共同盲区）；锚点多于解析结果（局部格式漂移会静默漏文件）或一条都
解析不出（整页漂移）→ 退出 3，宁可不输出也不输出不完整清单。
失败处理：accession 不符 GSE\\d+ → 退出 2；网络重试 3 次失败 → 退出 1；
404（无 suppl 目录）→ 合法空态：空清单 + log 记 listing_status=404。
解释边界：approx_size_bytes 是列表页人类可读标注的换算近似值（如
2.5K → 2560；实测 cell_info.txt.gz 列表 2560 vs 实际下载 2528），只用于
磁盘预算与清单粗核对，禁止直接作为 file_download 的 expected_bytes；
字节的终裁以实际下载后的字节数与 sha256 为准。
"""
timeout_secs = 1800
artifact_prefix = "/artifacts/geo_suppl_list"

[nodes.ports]
inputs = []
outputs = [
  { path = "suppl_manifest.tsv", format = "geo_suppl_manifest" },
  { path = "geo_fetch.log", format = "geo_fetch_log" },
]

[nodes.params]
accession = { type = "string", doc = "GEO series accession, e.g. GSE92742" }

[nodes.command]
interpreter = "python3"
script_file = "scripts/geo_fetch.py"

[nodes.command.env]
GEO_ACCESSION = "{{ accession }}"
GEO_MODE = "list"

[nodes.resources]
network = "egress"
cpus = 1
memory = "512m"
pull_policy = "never"
